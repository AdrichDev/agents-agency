services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent-agency-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 3AStudioDB
    ports:
      - "5433:5432"   # 5433 para no chocar con tu Postgres local
    volumes:
      - agent_agency_data:/var/lib/postgresql/data

  # n8n — workflow automation engine (opcional)
  # Arrancar con: docker compose --profile n8n up -d
  # NO arranca con el stack por defecto (profiles: ["n8n"])
  #
  # Primer arranque:
  #   1. docker compose --profile n8n up -d
  #   2. Abrir http://localhost:5678 y completar el setup de owner
  #   3. Settings → n8n API → Create an API key
  #   4. En back/.env: N8N_BASE_URL=http://localhost:5678 y N8N_API_KEY=<key>
  #   5. Si el backend corre en el host (no en Docker):
  #      usar BACK_URL=http://host.docker.internal:4000 en back/.env
  #   6. Definir AUTOMATION_WEBHOOK_SECRET (string aleatorio largo)
  #   7. Reiniciar el backend — las nuevas automations se sincronizarán
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-agents-agency
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Madrid
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # Permite require('crypto') en el nodo Code (verify HMAC del dispatcher del CRM).
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # Permite leer $env.AUTOMATION_WEBHOOK_SECRET dentro del Code node.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Secreto compartido con el back del CRM (firma HMAC del webhook). Override vía .env.
      - AUTOMATION_WEBHOOK_SECRET=${AUTOMATION_WEBHOOK_SECRET:-9313d4c1adb9d4c34a21ff5274e39e1bd9e585ce8014d3d80a1e451130763a18}
    volumes:
      - n8n_data:/home/node/.n8n
  # NOTA: la DB del CRM la define creador_CRM/docker-compose.yml (proyecto 3a_estudio,
  # imagen pgvector). Se eliminó aquí el servicio db-crm duplicado (postgres:16-alpine,
  # sin extensión vector) que chocaba en container_name/puerto 5434.

volumes:
  agent_agency_data:
    name: agents-agency_agent_agency_data
    external: true
  n8n_data:
    name: agents-agency_n8n_data
    external: true
