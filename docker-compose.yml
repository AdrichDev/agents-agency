services:
  # NOTA: la base de datos de agents-agency vive en Supabase (DATABASE_URL en back/.env,
  # schema `aa`, proyecto compartido con el CRM). El Postgres local pgvector (db pgvector
  # :5433, contenedor agent-agency-db) se RETIRÓ en la migración a Supabase.

  # n8n — workflow automation engine (opcional)
  # Variables: back/.env es el único .env del back. Docker lo lee con --env-file
  # (solo interpola las variables que este archivo referencia; n8n no ve el resto).
  # Arrancar con: cd back && npm run n8n:up   (o desde la raíz:
  #   docker compose --env-file back/.env up -d n8n)
  #
  # Primer arranque:
  #   1. cd back && npm run n8n:up
  #   2. Abrir http://localhost:5678 y completar el setup de owner
  #   3. Settings → n8n API → Create an API key
  #   4. En back/.env: N8N_BASE_URL=http://localhost:5678 y N8N_API_KEY=<key>
  #   5. Si el backend corre en el host (no en Docker):
  #      usar N8N_BACK_URL=http://host.docker.internal:4000 en back/.env
  #      (n8n llama al back directo, sin túnel; BACK_URL queda en localhost:4000)
  #   6. Definir AUTOMATION_WEBHOOK_SECRET en back/.env (string aleatorio largo,
  #      el mismo valor que el back del CRM)
  #   7. Reiniciar el backend — las nuevas automations se sincronizarán
  n8n:
    image: n8nio/n8n:3.2.2
    container_name: n8n-agents-agency
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Public base URL n8n uses for webhooks (e.g. the current cloudflared tunnel).
      # Set N8N_WEBHOOK_URL in .env; defaults to the local n8n address.
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Europe/Madrid
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # Permite require('crypto') en el nodo Code (verify HMAC del dispatcher del CRM).
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # Permite leer $env.AUTOMATION_WEBHOOK_SECRET dentro del Code node.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Secreto compartido con el back del CRM (firma HMAC del webhook). Obligatorio en .env.
      - AUTOMATION_WEBHOOK_SECRET=${AUTOMATION_WEBHOOK_SECRET:?set AUTOMATION_WEBHOOK_SECRET in .env}
    volumes:
      - n8n_data:/home/node/.n8n
  # NOTA: la DB del CRM la define creador_CRM/docker-compose.yml (proyecto 3a_estudio,
  # imagen pgvector). Se eliminó aquí el servicio db-crm duplicado (postgres:16-alpine,
  # sin extensión vector) que chocaba en container_name/puerto 5434.

volumes:
  n8n_data:
    name: agents-agency_n8n_data
    external: true
